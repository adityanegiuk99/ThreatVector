name: scheduled-ingest

# Day 3: periodic incremental ingestion of public intel sources.
# KEV every 3h, NVD every 6h (3-day lookback), ATT&CK daily at 03:00 UTC.
# Runs the same code paths as app.services.scheduler.run_once.

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "43 */6 * * *"
    - cron: "3 3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Source to refresh"
        required: true
        default: all
        type: choice
        options: [kev, nvd, attack, all]
      lookback_days:
        description: "NVD lookback (days)"
        required: false
        default: "3"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: veylix_ci
      POSTGRES_USER: veylix
      POSTGRES_PASSWORD: veylix_ci_password
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: veylix_ci
          POSTGRES_USER: veylix
          POSTGRES_PASSWORD: veylix_ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veylix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Migrate
        run: alembic upgrade head
      - name: Ingest scheduled sources
        run: |
          case "${{ github.event.schedule || '' }}" in
            "17 */3 * * *") SRC=kev ;;
            "43 */6 * * *") SRC=nvd ;;
            "3 3 * * *")    SRC=attack ;;
            *) SRC="${{ inputs.source || 'all' }}" ;;
          esac
          echo "Ingesting: $SRC"
          python -m app.services.ingest_all --source "$SRC" \
            --lookback-days "${{ inputs.lookback_days || '3' }}"
      - name: Report last run status
        if: always()
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from app.db.session import engine
          with engine.connect() as conn:
              rows = conn.execute(text(
                  "SELECT source, status, records_fetched, records_upserted, finished_at "
                  "FROM ingestion_runs ORDER BY id DESC LIMIT 5")).fetchall()
          for r in rows:
              print(r)
          PY
