[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veylix"
version = "0.1.0"
description = "Veylix — AI Cyber Threat Intelligence Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
